name: Validar AutoMail Next.js
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --prefix web --no-audit --no-fund
      - name: Compilar Next.js
        run: npm run build --prefix web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/ci_prepare_site.py
