name: AutoMail · Generar Next.js y publicar desde la rama
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/ci.yml'
      - 'manifest.json'
      - 'background.js'
      - 'dashboard.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: automail-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias y fijar lockfile
        run: npm install --prefix web --no-audit --no-fund
      - name: Construir Next.js export estático
        run: npm run build --prefix web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar y validar sitio + canal de actualización
        run: python3 tools/ci_prepare_site.py
      - name: Publicar Next.js en raíz y /docs (compatibilidad con ambos orígenes Pages)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/_next docs/previews docs/downloads _next previews downloads _site/downloads
          rsync -a --delete _site/_next/ docs/_next/
          rsync -a --delete _site/_next/ _next/
          rsync -a --delete _site/previews/ docs/previews/
          rsync -a --delete _site/previews/ previews/
          rsync -a --delete _site/downloads/ docs/downloads/
          rsync -a --delete _site/downloads/ downloads/
          cp _site/index.html docs/index.html
          cp _site/index.html index.html
          if [ -f _site/404.html ]; then cp _site/404.html docs/404.html; cp _site/404.html 404.html; fi
          cp _site/updates.json docs/updates.json
          cp _site/updates.json updates.json
          touch docs/.nojekyll .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/_next docs/previews docs/downloads docs/index.html docs/updates.json docs/.nojekyll
          git add -A _next previews downloads index.html updates.json .nojekyll
          if [ -f docs/404.html ]; then git add docs/404.html; fi
          git add web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(pages): exportar Next.js estático a /docs [skip ci]"
            git push origin HEAD:main
          else
            echo "Sitio sin cambios para publicar"
          fi
