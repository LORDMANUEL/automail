name: AutoMail · Next.js y GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/ci.yml'
      - 'manifest.json'
      - 'background.js'
      - 'dashboard.js'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: automail-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias y fijar lockfile
        run: npm install --prefix web --no-audit --no-fund
      - name: Construir Next.js export estático
        run: npm run build --prefix web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar y validar sitio + canal de actualización
        run: python3 tools/ci_prepare_site.py
      - name: Publicar el sitio estático en /docs (compatibilidad con Pages en modo branch)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/_next docs/previews
          cp -a _site/_next/. docs/_next/
          cp -a _site/previews/. docs/previews/
          cp _site/index.html docs/index.html
          if [ -f _site/404.html ]; then cp _site/404.html docs/404.html; fi
          cp _site/updates.json docs/updates.json
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/_next docs/previews docs/index.html docs/updates.json docs/.nojekyll
          if [ -f docs/404.html ]; then git add docs/404.html; fi
          git add web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(pages): exportar Next.js estático a /docs [skip ci]"
            git push origin HEAD:main
          else
            echo "Sitio sin cambios para publicar"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
