name: Publicar AutoMail XPI
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix web --no-audit --no-fund
      - run: npm run build --prefix web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/ci_prepare_site.py --require-package
      - name: Comprobar coincidencia de versiones
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import json,os
          version=json.load(open('manifest.json',encoding='utf8'))['version']
          assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Versiones inconsistentes'
          PY
      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="_site/downloads/correo-calendario-${VERSION}.xpi"
          test -s "$FILE"
          gh release create "$GITHUB_REF_NAME" "$FILE" --repo "$GITHUB_REPOSITORY" --title "AutoMail ${VERSION}" --generate-notes
