name: AutoMail · Release XPI verificada
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'background.js'
      - 'contact-manager.js'
      - 'contact-profile.js'
      - 'dashboard.js'
      - 'tools/package_release.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: automail-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix web --no-audit --no-fund
      - run: npm run build --prefix web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar y probar fuentes completas del complemento
        run: python3 tools/ci_prepare_site.py --require-package
      - name: Crear release inmutable por versión
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json;print(json.load(open("manifest.json"))["version"])')"
          TAG="v${VERSION}"
          FILE="_site/downloads/correo-calendario-${VERSION}.xpi"
          test -s "$FILE"
          SHA="$(sha256sum "$FILE" | cut -d' ' -f1)"
          echo "Versión: $VERSION"
          echo "SHA256: $SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG ya existe; no sobrescribir binario publicado."
            exit 0
          fi
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AutoMail $VERSION · Thunderbird 153+" \
            --notes "XPI compilado en GitHub Actions. SHA-256: $SHA. Consulta README, App Flow, política de privacidad y notas de QA. Thunderbird debe permanecer abierto para envíos programados. No equivale a aprobación ATN."
